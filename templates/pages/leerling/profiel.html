{% extends "base.html" %} {% block content%}

<div class="main-content">
    <div class="header">
        <div class="page-title">
            <h1>Profiel</h1>
        </div>
        <div class="page-subtitle">Jouw gegevens, {{ session.gebruikersnaam }}.</div>
    </div>
    {% for x in profiel %}
    <p>ID: {{ x.id }}</p>
    <p>Naam: {{ x.name }}</p>
    {%if user == "leerling" %}
    <p>Klas: {{ x.klas }}</p>
    {%endif%}
    {% endfor %}
</div>
{% endblock %}
