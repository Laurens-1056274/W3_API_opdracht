{% extends "base.html" %}
{% block content %}

<div class="main-content">

    <div class="page-title">
        <h1>Leerdoelen</h1>
        <p style="color: #718096; font-size: 0.9rem;">
            Bekijk ook je <a href="{{url_for('kernwoorden')}}" style="color: #4895ef; text-decoration: none;">
                <i class="fa fa-key"></i> Kernwoorden analyse
            </a>
        </p>
    </div>

    <div style="padding: 0 20px; margin-bottom: 20px; text-align: center;">
        <label for="chartTypeSelect">Kies vak:</label>
        <select id="chartTypeSelect">
            <option value="AlleVakken">Alle vakken</option>
            <option value="Biologie">Biologie</option>
            <option value="Natuurkunde">Natuurkunde</option>
            <option value="Scheikunde">Scheikunde</option>
            <option value="Wiskunde">Wiskunde</option>
        </select>
    </div>

    <h2 id="noResults" style="display:none; text-align:center;">

<style>
.keyword-tag {
    display: inline-block;
    padding: 4px 10px;
    margin: 2px 4px;
    background: #e7f3ff;
    color: #4895ef;
    border-radius: 12px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s ease;
    border: 1px solid #4895ef;
}

.keyword-tag:hover {
    background: #4895ef;
    color: white;
    transform: translateY(-1px);
    box-shadow: 0 2px 4px rgba(72, 149, 239, 0.3);
}

.keyword-tag.active {
    background: #4895ef;
    color: white;
    font-weight: bold;
}

.keywords-container {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin: 10px 0;
}
</style>
        U heeft (nog) geen resultaten voor dit vak
    </h2>

    <!-- AJAX will fill this -->
    <div class="scroll-container"></div>

</div>

<script src="{{ url_for('static', filename='learninggoals.js') }}"></script>

{% endblock %}
