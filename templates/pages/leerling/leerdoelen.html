{% extends "base.html" %}{% block content %}
<h1>Leerdoelen</h1>

<div style="width: 200px; margin: 20px auto; text-align: center">
    <label for="chartTypeSelect">Kies vak:</label>
    <select id="chartTypeSelect">
        <option value="AlleVakken">Alle vakken</option>
        <option value="Biologie">Biologie</option>
        <option value="Natuurkunde">Natuurkunde</option>
        <option value="Scheikunde">Scheikunde</option>
        <option value="Wiskunde">Wiskunde</option>
    </select>
</div>

<div class="scroll-container">
    {% for x in learning_goals %}
        <div class="learning-goal" data-subject="{{ x.subject }}">
            <hr>
            <h2>{{ x.title }}:</h2>
            <p style="display:inline; padding: 10px;">
                Vak: {{ x.subject }}
            </p>
            <hr>

            <div class="profile-container">
                <div class="profile-card">
                    <p>Keywords: {{ x.keywords }}</p>
                    <p>Gemiddelde Kennen: {{ x.avg_kennen }}</p>
                    <p>Gemiddelde Kunnen: {{ x.avg_kunnen }}</p>
                </div>
            </div>
        </div>
    {% endfor %}
</div>

<script src="{{ url_for('static', filename='learninggoals.js') }}"></script>

{% endblock %}
