{% extends "base.html" %} {% block content %}
<!-- Docent Dashboard Content -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script defer src="{{ url_for('static', filename='docentdashboard.js') }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}" />
<!--main content-->
<div class="main-content">
	<div class="header">
		<div class="page-title">
			<h1>Dashboard</h1>
			<div class="page-subtitle">Welkom terug, {{ name }}.</div>
		</div>
	</div>
	<!--type selector-->
	<div class="dashboard-filters">
		<div class="student-selector">
			<label for="classSelect">Kies klas:</label>
			<select id="classSelect">
				{% for klas in classes %}
				<option value="{{ klas }}">{{ klas }}</option>
				{% endfor %}
			</select>
		</div>
		<div class="chart-type-selector">
			<label for="chartTypeSelect">Kies type:</label>
			<select id="chartTypeSelect">
				<option value="all" selected>Alles</option>
				<option value="quiz">Quiz</option>
				<option value="project">Project</option>
				<option value="test">Test</option>
				<option value="observatie">Observatie</option>
			</select>
		</div>
	</div>

	<div class="chart-container">
		<canvas id="myChart"></canvas>
	</div>

	<div class="class-stats-card">
		<div class="stat-item">
			<span class="stat-label">Gemiddelde klas:</span>
			<span class="stat-value" id="classAverageDisplay">-</span>
		</div>
	</div>

	<div class="class-overview-card">
		<h3>Leerlingenoverzicht</h3>
		<table id="classOverviewTable" class="class-overview-table">
			<thead>
				<tr>
					<th>Leerling</th>
					<th>Kennen (%)</th>
					<th>Kunnen (%)</th>
					<th>Globale voortgang (%)</th>
					<th>Status</th>
				</tr>
			</thead>
			<tbody id="classOverviewBody">
				<tr>
					<td colspan="5">Nog geen data geladen</td>
				</tr>
			</tbody>
		</table>
	</div>
</div>
</div>
{% endblock %}
