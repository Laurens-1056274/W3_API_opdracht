{% extends "base.html" %}

{% block content %}
<!-- Docent Dashboard Content -->
<div class="dashboard-container">
            <!--sidebar-->
            <div class="sidebar">
                <div class="nav-item">
                    <i class="fa fa-home"></i>
                    <span>Dashboard</span>
                </div>
                <div class="nav-item">
                    <i class="fa fa-users"></i>
                    <span>Klassen</span>
                </div>
                <div class="nav-item">
                    <i class="fa fa-chart-bar"></i>
                    <span>Voortgang</span>
                </div>
                <div class="nav-item">
                    <i class="fa fa-pencil-alt"></i>
                    <span>Leerdoelen</span>
                </div>
                <div class="nav-item">
                    <i class="fa fa-user-circle"></i>
                    <span>Profiel</span>
                </div>
                <div class="nav-item">
                    <i class="fa fa-sign-out-alt"></i>
                    <span>Uitloggen</span>
                </div>
            </div>

            <!--main content-->
            <div class="main-content">
                <div class="header">
                    <div class="page-title">
                        <h1>Dashboard</h1>
                        <div class="page-subtitle">Welkom terug, {{ name }}.</div>
                    </div>
                </div>

                <!--type selector-->
                <div style="width: 200px; margin: 20px auto; text-align: center">
                    <label for="chartTypeSelect">Kies type:</label>
                    <select id="chartTypeSelect">
                        <option value="all" selected>Alles</option>
                        <option value="quiz">Quiz</option>
                        <option value="project">Project</option>
                        <option value="test">Test</option>
                        <option value="observatie">Observatie</option>
                    </select>
                </div>

                <div
                    class="chart-container"
                    style="
                        width: 90%;
                        max-width: 1000px;
                        margin: 40px auto;
                        height: 400px;
                    "
                >
                    <canvas id="myChart"></canvas>
                </div>

                <script src="{{ url_for('static', filename='docentdashboard.js') }}"></script
{% endblock %}
